name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Package install smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m aha_moment_recorder --help

      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m py_compile aha_moment_recorder/*.py tests/*.py

      - name: Diff hygiene
        run: git diff --check

      - name: Evidence summary
        run: |
          echo "VERDICT=verified: deterministic package, test, compile, and diff checks passed"
          echo "LIVE_SMOKE=bounded caveat: not run; CI uses the fake transport and no private endpoint"
          echo "HUMAN_OR_SECOND_DEVICE=unknown: outside this deterministic CI scope"

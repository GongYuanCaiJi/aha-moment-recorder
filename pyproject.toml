[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "aha-moment-recorder"
version = "0.1.0"
description = "Portable standard-library core pipeline for personal records"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
macos = ["apple-notes-parser>=0.2,<0.3"]
authors = [{name = "GongYuanCaiJi"}]
keywords = ["personal-records", "local-first", "obsidian", "macos", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/GongYuanCaiJi/aha-moment-recorder"
Issues = "https://github.com/GongYuanCaiJi/aha-moment-recorder/issues"
Security = "https://github.com/GongYuanCaiJi/aha-moment-recorder/security/policy"

[project.scripts]
aha-moment-recorder = "aha_moment_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["aha_moment_recorder*"]
